<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20C9BD" />
      <stop offset="50%" stop-color="#123354" />
      <stop offset="100%" stop-color="#E9B65A" />
    </linearGradient>
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123354" />
      <stop offset="100%" stop-color="#070D17" />
    </linearGradient>
    <radialGradient id="irisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#20C9BD" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#57B86B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#20C9BD" stop-opacity="0" />
    </radialGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer orbital trajectory -->
  <ellipse cx="100" cy="100" rx="88" ry="44" transform="rotate(-28 100 100)" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="140 10 40 10" opacity="0.85" />
  
  <!-- Outer Satellite Node -->
  <circle cx="172" cy="62" r="5" fill="#E9B65A" filter="url(#glowFilter)" />
  <circle cx="172" cy="62" r="2" fill="#FFFFFF" />

  <!-- The Eye Outer Contour -->
  <path d="M 24 100 C 56 60 144 60 176 100 C 144 140 56 140 24 100 Z" fill="#0B1728" stroke="#20C9BD" stroke-width="3" />

  <!-- Inner Iris / Earth Disc -->
  <circle cx="100" cy="100" r="32" fill="url(#earthGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
  <circle cx="100" cy="100" r="32" fill="url(#irisGlow)" />

  <!-- Agricultural Furrow / Leaf Contour -->
  <path d="M 82 108 C 88 92 104 84 116 84 C 112 100 96 114 82 108 Z" fill="#57B86B" opacity="0.85" />
  <path d="M 88 114 C 98 102 112 98 122 96 C 118 110 104 118 88 114 Z" stroke="#E9B65A" stroke-width="1.5" fill="none" opacity="0.75" />

  <!-- Pupil / Sensor Aperture -->
  <circle cx="100" cy="100" r="8" fill="#070D17" stroke="#20C9BD" stroke-width="2" />
  <circle cx="98" cy="98" r="2.5" fill="#FFFFFF" />

  <!-- Coordinate Crosshairs (Subtle Scientific reticle) -->
  <line x1="100" y1="56" x2="100" y2="64" stroke="#20C9BD" stroke-width="1.5" opacity="0.6" />
  <line x1="100" y1="136" x2="100" y2="144" stroke="#20C9BD" stroke-width="1.5" opacity="0.6" />
  <line x1="12" y1="100" x2="20" y2="100" stroke="#20C9BD" stroke-width="1.5" opacity="0.6" />
  <line x1="180" y1="100" x2="188" y2="100" stroke="#20C9BD" stroke-width="1.5" opacity="0.6" />
</svg>
